name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build & Typecheck Frontend
        run: |
          cd frontend
          npm ci || npm install
          npx tsc --noEmit
          npm run build
      - name: Run Go Tests
        run: go test -v -race ./tests/... ./...
      - name: Build Binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o teepost ./cmd/teepost
